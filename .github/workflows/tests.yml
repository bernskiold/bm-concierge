name: Tests

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-tests.yml@main
        with:
            # Drop 7.2-RC3 once 7.2 is released and "latest" picks it up.
            wp-versions: '["7.0","latest","7.2-RC3"]'
            js-unit: true
            js-lint: true
            check-dist: true
            # Not yet: phpcs (WPCS 3) still reports existing violations.
            php-lint: false

    # WordPress supports PHP 8.6 from 7.2. Older cores call spl_object_hash(),
    # which PHP 8.6 deprecates, so test 8.6 against the latest release only.
    php-86:
        name: Tests (PHP 8.6)
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-tests.yml@main
        with:
            php-versions: '["8.6"]'
            wp-versions: '["latest","7.2-RC3"]'
